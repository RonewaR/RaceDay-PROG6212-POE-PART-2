name: RaceDay Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          echo "Checking RaceDay files..."

          echo "Files in repository:"
          find . -maxdepth 3 -type f -print

          echo "Checking for assignment files..."

          find . -iname "*.pdf" | grep -qi "api" || {
            echo "ERROR: API Endpoint Plan PDF not found"
            exit 1
          }

          find . -iname "*.sql" | grep -qi "raceday" || {
            echo "ERROR: RaceDay SQL file not found"
            exit 1
          }

          find . \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | grep -qi "raceday" || {
            echo "ERROR: RaceDay ERD image not found"
            exit 1
          }

          echo "All required files were found!"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/Raceday.api.sln

      - name: Build solution
        run: dotnet build RaceDay.API/Raceday.api.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.API/Raceday.api.sln --configuration Release --no-build

      - name: Validation successful
        run: echo "RaceDay validation, build, and tests passed successfully!"